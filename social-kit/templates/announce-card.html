<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_kit.css"></head>
<!-- ANNOUNCEMENT / date card — the information IS the content.
     Voice: second person, invitational ("Come build with us"), no emojis on the visual.
     Story variant: replace CTA chip with the native link sticker — never paint a fake button. -->
<body data-type="workshop-teal">
  <div class="stripe"></div>
  <div class="col">
    <div class="kicker">Workshop · London</div>
    <div style="font-size:92px;font-weight:700;line-height:1.05;max-width:14ch;margin-top:56px;">Build your own bamboo bike in a weekend</div>
    <div style="font-size:48px;font-weight:700;margin-top:48px;">Two days. No experience needed.</div>
    <div style="font-size:36px;margin-top:16px;opacity:.92;">Next dates at bamboobicycleclub.org</div>
    <div style="position:absolute;bottom:12px;display:inline-flex;background:var(--gold);color:var(--forest);font-size:36px;font-weight:700;padding:22px 40px;border-radius:24px;">Book your bench</div>
  </div>
  <div class="logo"><img class="sym" src="bbc-roundel.png" alt=""><span class="word" style="color:#fff;">Bamboo Bicycle Club</span></div>
</body></html>
